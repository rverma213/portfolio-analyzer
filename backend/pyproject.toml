[project]
name = "smallcap"
version = "0.1.0"
description = "Spec B – fundamental, bottom-up global small-cap strategy"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyarrow>=14",
  "duckdb>=1.0",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
real = ["yfinance>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]
